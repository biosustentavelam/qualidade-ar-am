name: Qualidade do ar (a cada 30 min)
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ar_purpleair.py
        env:
          PURPLEAIR_KEY: ${{ secrets.PURPLEAIR_KEY }}
      - run: |
          git config user.name "atualizacao-automatica"
          git config user.email "actions@users.noreply.github.com"
          git add ar.json
          git diff --cached --quiet || git commit -m "Atualiza qualidade do ar"
          git push
